[package]
name = "sealsmith"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Release, verify and audit Cybercore software with signing keys that never leave your machine"
license = "MIT"
repository = "https://github.com/cybercoretech/sealsmith"
keywords = ["release", "signing", "verification", "android", "supply-chain"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
